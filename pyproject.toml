[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapeunblocker-vinted"
version = "0.1.0"
description = "Scrape Vinted listings, item details and seller profiles across all 23 Vinted country sites into clean JSON/CSV via the ScrapeUnblocker API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ScrapeUnblocker" }]
keywords = [
    "vinted",
    "vinted-scraper",
    "vinted-api",
    "vinted-bot",
    "second-hand",
    "resale",
    "reselling",
    "price-tracking",
    "web-scraping",
    "scraper",
    "scrapeunblocker",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["scrapeunblocker>=0.7,<1", "beautifulsoup4>=4.10"]

[project.urls]
Homepage = "https://scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"
Documentation = "https://docs.scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
vinted-scraper = "scrapeunblocker_vinted.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
